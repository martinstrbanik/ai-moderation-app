spring.application.name=automoder

# ============================================================
#  CONFIG WITH PLACEHOLDER VALUES
#  This file is committed to the repository. Real values belong
#  in application-local.properties (NOT committed - see .gitignore).
#
#  In dev the "local" profile is activated automatically (spring.profiles.active).
#  Outside a local environment the values must be provided via env variables
#  DB_URL, DB_USERNAME, DB_PASSWORD, ADMIN_USERNAME, ADMIN_PASSWORD,
#  CRYPTO_MASTER_KEY (and optionally SPRING_PROFILES_ACTIVE).
# ============================================================

# ---- Profiles ----
# in dev the "local" profile is activated (if application-local.properties exists)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ---- Database (PostgreSQL) ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ---- Admin account (HTTP Basic) ----
automoder.admin.username=${ADMIN_USERNAME}
automoder.admin.password=${ADMIN_PASSWORD}

# ---- Encryption of BYO OpenRouter keys (AES/GCM) ----
automoder.crypto.master-key=${CRYPTO_MASTER_KEY}

# ---- OpenRouter (AI provider) ----
automoder.openrouter.base-url=https://openrouter.ai/api/v1
# read timeout per call (seconds) - lower it for slow/free models to avoid long hangs
automoder.openrouter.timeout-seconds=120

# ---- Datasets (relative path from the backend directory) ----
automoder.datasets.path=../data/processed

# ---- Benchmark ----
# how many samples are sent to the model in one OpenRouter call (batching)
automoder.benchmark.batch-size=10